localization_fusion:
  # If true, uses /awsim/ground_truth/vehicle/pose directly and publishes
  # fused pose + speed at the same rate as ground truth (typically ~100 Hz).
  use_ground_truth_pose: true

  # Input topics
  gnss_topic: /sensing/gnss/pose
  imu_topic: /sensing/imu/tamagawa/imu_raw
  ground_truth_pose_topic: /awsim/ground_truth/vehicle/pose

  # Output topics
  output_odom_topic: /simple_av/localization/odometry_fused

  # Frames / TF
  map_frame: map
  base_frame: base_link
  publish_tf: true

  # Simple fusion settings (used when use_ground_truth_pose is false)
  publish_rate_hz: 50.0
  use_imu_orientation: false
  position_smoothing_alpha: 0.2
  orientation_smoothing_alpha: 0.2

  # EKF fusion (reserved for future use)
  # Uncomment and use robot_localization if needed later.
  # ekf_fusion:
  #   frequency: 50.0
  #   sensor_timeout: 0.2
  #   map_frame: map
  #   base_frame: base_link
  #   odom_frame: odom
  #   gnss_topic: /sensing/gnss/pose
  #   imu_topic: /sensing/imu/tamagawa/imu_raw
