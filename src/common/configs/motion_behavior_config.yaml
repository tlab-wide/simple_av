motion:
  max_turning_angle: 35.0  # Maximum allowable turning angle (degrees)
  max_lateral_accel: 4.0   # Lateral acceleration limit (m/s^2)
  curve_calc_dist: 6       # Points on each side used for curvature calculation
  
  speed_limits:
    base: 8.33     # Default base speed (m/s)
    turning_speed: 3.0 # Default speed on turns (m/s)
    min: 0.83      # Minimum speed clamp (m/s)
    cool4_min: 0.83    # Cool4 minimum speed (m/s)
    cool4_middle: 1.67 # Cool4 middle speed (m/s)
    cool4_max: 3.33    # Cool4 maximum speed (m/s)

  lookahead:
    coefficient: 1.5    # Scaling factor for lookahead distance
    base: 2.0 # Multiplier based on vehicle speed

  path:
    densify_interval: 0.5 # meters / Distance between each two consecutive waypoints on a lane

  trajectory:
    length: 100.0 # meters / Length of motion planning trajectory

control:
  pid:
    p_gain: 5.0
    i_gain: 5.0
    d_gain: 1.5

behavior:
  range_low_pass_gain: 0.90

  collision_avoidance:
    prediction: 
      safety_distance: 16.0  # Minimum stopping distance behind an object (meters)
      reaction_time_threshold: 5.0  # Time delay before reacting to an event (seconds)
      detection_angle_deg: 180.0  # Forward field-of-view angle for prediction filtering (degrees)
      reaction_range:
        coefficient: 10.0  # Scaling factor for reaction distance
        base: 75.0         # Base reaction distance (meters)

      detection_range:
        coefficient: 10.0  # Scaling factor for detection radius
        base: 100.0      # Base detection radius (meters)
    
    on_path:
      safety_distance: 4.0  # Minimum stopping distance behind an object (meters)
      path_distance_threshold: 1.5 # Max lateral distance from path to consider object on-path (meters)
      detection_angle_deg: 180.0  # Forward field-of-view angle for detected-object filtering (degrees)
      detection_range:
        coefficient: 5.0  # Scaling factor for detection radius
        base: 50.0      # Base detection radius (meters)

  traffic_light:
    stop_offset: 1.0  # Stop this many meters before the stop line (meters)
