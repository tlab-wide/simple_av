motion:
  max_turning_angle: 35.0  # Maximum allowable turning angle (degrees)
  
  speed_limits:
    base: 7.0     # Default base speed (m/s)
    turning_speed: 1.75 # Default speed on turns (m/s)

  lookahead:
    coefficient: 3    # Scaling factor for lookahead distance
    base: 2.5 # Multiplier based on vehicle speed

behavior:
  safety_distance: 12.0  # Minimum stopping distance behind an object (meters)
  reaction_time_threshold: 25  # Time delay before reacting to an event (seconds)

  on_path_detection_range: # Detection range for Objects on the path
    coefficient: 6.0 # Scaling factor for reaction distance
    base: 8.0        # Base reaction distance (meters)

  prediction_reaction_range: 
    coefficient: 10.0  # Scaling factor for reaction distance
    base: 90.0         # Base reaction distance (meters)

  prediction_detection_range:
    coefficient: 10.0  # Scaling factor for detection radius
    base: 100.0        # Base detection radius (meters)
